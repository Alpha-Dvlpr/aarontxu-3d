media:
  - name: site_images
    label: Imágenes del sitio
    input: img
    output: /img
    categories: [image]

content:
  - name: aarontxu_3d
    label: Aarontxu 3D
    type: file
    path: _data/aarontxu_3d.json
    format: json
    fields:
      - name: profile
        label: Portada
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: description, label: Presentación, type: text, list: true }
          - { name: externalTitle, label: Título de la tarjeta de enlaces externos, type: string }
          - name: chips
            label: Enlaces
            type: object
            list: true
            fields:
              - { name: name, label: Texto, type: string }
              - { name: destination, label: Destino, type: string }
              - { name: newPage, label: Abrir en otra pestaña, type: boolean }
      - name: productsAndServices
        label: Productos y servicios
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: description, label: Presentación, type: text, list: true }
          - name: elements
            label: Productos
            type: object
            list: true
            fields:
              - { name: id, label: Identificador, type: string }
              - { name: title, label: Producto, type: string }
              - name: category
                label: Categoría
                type: object
                fields:
                  - { name: id, label: Identificador, type: string }
                  - { name: name, label: Nombre, type: string }
              - { name: description, label: Descripción, type: text, list: true }
              - { name: price, label: Precio, type: number }
              - { name: price_label, label: Precio mostrado (opcional), type: string }
              - name: images
                label: Imágenes
                type: image
                options:
                  media: site_images
                  multiple: { max: 20 }
      - name: privacy
        label: Política de privacidad
        type: object
        fields:
          - { name: title, label: Título de la página, type: string }
          - { name: linkLabel, label: Texto del enlace en el pie, type: string }
          - name: sections
            label: Apartados
            type: object
            list: true
            fields:
              - { name: heading, label: Encabezado, type: string }
              - { name: paragraphs, label: Párrafos, type: text, list: true }
      - name: nfcGuide
        label: Guía de llaveros NFC
        type: object
        fields:
          - { name: title, label: Título de la cabecera, type: string }
          - { name: heading, label: Título de la página, type: string }
          - { name: intro, label: Introducción, type: text, list: true }
          - name: app
            label: App recomendada
            type: object
            fields:
              - { name: heading, label: Encabezado, type: string }
              - { name: disclosure, label: Aviso de no patrocinio, type: text }
              - { name: versionNote, label: Aviso de versiones, type: text }
              - name: stores
                label: Botones de descarga
                type: object
                list: true
                fields:
                  - { name: id, label: Identificador (android o ios), type: string }
                  - { name: prefix, label: Texto pequeño, type: string }
                  - { name: name, label: Nombre de la tienda, type: string }
                  - { name: url, label: Enlace, type: string }
          - name: selector
            label: Selector de móvil
            type: object
            fields:
              - { name: title, label: Pregunta, type: string }
          - name: platforms
            label: Guías por móvil
            type: object
            list: true
            fields:
              - { name: id, label: Identificador (android o ios), type: string }
              - { name: name, label: Nombre, type: string }
              - name: steps
                label: Pasos
                type: object
                list: true
                fields:
                  - { name: title, label: Título, type: string }
                  - { name: text, label: Texto, type: text, list: true }
                  - { name: optionsLabel, label: Título del selector de opciones (opcional), type: string }
                  - name: options
                    label: Opciones (opcional)
                    type: object
                    list: true
                    fields:
                      - { name: id, label: Identificador (whatsapp activa el ayudante), type: string }
                      - { name: label, label: Nombre, type: string }
                      - { name: text, label: Texto, type: text, list: true }
          - name: whatsapp
            label: Ayudante de WhatsApp
            type: object
            fields:
              - { name: checkboxLabel, label: Texto de la casilla, type: string }
              - { name: title, label: Título, type: string }
              - { name: privacy, label: Aviso de privacidad, type: text }
              - { name: prefixLabel, label: Etiqueta del prefijo, type: string }
              - { name: numberLabel, label: Etiqueta del número, type: string }
              - { name: numberHint, label: Ayuda del número, type: string }
              - { name: errorSpain, label: Error número de España, type: string }
              - { name: errorOther, label: Error otros países, type: string }
              - { name: generate, label: Botón generar, type: string }
              - { name: resultLabel, label: Etiqueta del resultado, type: string }
              - { name: copy, label: Botón copiar, type: string }
              - { name: copied, label: Texto tras copiar, type: string }
              - { name: copyError, label: Error al copiar, type: string }
              - { name: close, label: Botón cerrar, type: string }
              - name: prefixes
                label: Prefijos
                type: object
                list: true
                fields:
                  - { name: name, label: País, type: string }
                  - { name: code, label: Prefijo (sin +), type: string }
          - name: ui
            label: Textos de la interfaz
            type: object
            fields:
              - { name: stepOf, label: Contador ({n} y {total}), type: string }
              - { name: prev, label: Botón anterior, type: string }
              - { name: next, label: Botón siguiente, type: string }
              - { name: restart, label: Botón reiniciar, type: string }
              - { name: finished, label: Mensaje final, type: string }
              - { name: externalNote, label: Aviso enlace externo, type: string }
      - name: languages
        label: Idiomas de traducción
        type: object
        fields:
          - { name: es, label: Español, type: string }
          - { name: en, label: Inglés, type: string }
          - { name: fr, label: Francés, type: string }
          - { name: it, label: Italiano, type: string }
          - { name: de, label: Alemán, type: string }
          - { name: pt, label: Portugués, type: string }
